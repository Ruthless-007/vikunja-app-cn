name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Configure Gradle Memory & Android SDK
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError" >> ~/.gradle/gradle.properties
          echo "android.useAndroidX=true" >> ~/.gradle/gradle.properties
          echo "android.enableJetifier=true" >> ~/.gradle/gradle.properties

      - name: Install dependencies & Gen L10n
        run: |
          flutter pub get
          flutter gen-l10n

      - name: Build APK (Release ARM64)
        run: |
          flutter build apk --release --target-platform android-arm64 --no-tree-shake-icons -v

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vikunja-cn-arm64-release
          path: build/app/outputs/flutter-apk/*.apk
