name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter (Stable with Dart 3.9+)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create Release Keystore & Signing Config
        run: |
          keytool -genkeypair -v -keystore android/app/upload-keystore.jks \
            -keyalg RSA -keysize 2048 -validity 10000 -alias upload \
            -storepass android -keypass android \
            -dname "CN=Vikunja, OU=Dev, O=Selfhost, L=CN, S=CN, C=CN"
          cat <<EOF > android/key.properties
          storePassword=android
          keyPassword=android
          keyAlias=upload
          storeFile=upload-keystore.jks
          EOF

      - name: Configure Gradle Environment (Anti-Hang)
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" >> ~/.gradle/gradle.properties
          echo "org.gradle.vfs.watch=false" >> ~/.gradle/gradle.properties
          echo "org.gradle.daemon=false" >> ~/.gradle/gradle.properties

      - name: Install Dependencies & Generate L10n
        run: |
          flutter pub get
          flutter gen-l10n

      - name: Build Android ARM64 APK
        run: |
          flutter build apk --release --flavor unsigned --target-platform android-arm64 --no-tree-shake-icons || \
          flutter build apk --release --target-platform android-arm64 --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vikunja-cn-arm64-release
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: warn
