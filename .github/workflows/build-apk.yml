name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies & Generate L10n
        run: |
          flutter pub get
          flutter gen-l10n

      - name: Build Unsigned Release APK
        run: |
          # 优先使用官方 unsigned 变体编译，若无变体则回退常规编译
          flutter build apk --release --flavor unsigned --target-platform android-arm64 --no-tree-shake-icons || \
          flutter build apk --release --target-platform android-arm64 --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vikunja-cn-arm64-release
          path: build/app/outputs/flutter-apk/*.apk
